<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#103d35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quran Reciter">
  <meta name="description" content="A simple, personal Quran recitation audio player.">
  <link rel="icon" type="image/png" sizes="180x180" href="./quran-reciter-icon.png?v=2">
  <link rel="icon" type="image/svg+xml" href="./quran-reciter-icon.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./quran-reciter-icon.png?v=2">
  <title>Quran Reciter</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-mark" aria-hidden="true"><img src="./quran-reciter-icon.svg?v=2" width="46" height="46" alt=""></div>
      <div><h1>Quran Reciter</h1><p>Listen. Learn. Perfect Your Tajweed</p></div>
    </header>

    <section class="player" aria-label="Audio player">
      <div class="player-art" aria-hidden="true"><svg viewBox="0 0 90 90" width="70" height="70" fill="none"><path d="M45 24C37 18 25 16 13 20v46c12-4 24-2 32 5 8-7 20-9 32-5V20c-12-4-24-2-32 4Z" stroke="currentColor" stroke-width="3.7" stroke-linejoin="round"/><path d="M45 24v47M21 30c7-1 13 0 17 3M52 33c5-3 11-4 17-3M21 41c7-1 13 0 17 3M52 44c5-3 11-4 17-3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
      <p class="eyebrow" id="now-number">NO SURAH SELECTED</p>
      <h2 id="now-title">Choose a recitation</h2>
      <p class="player-subtitle" id="now-subtitle">Select a Surah from the list below</p>
      <div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek within Surah" disabled><div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div></div>
      <div class="controls" aria-label="Playback controls">
        <button type="button" class="icon-btn mode-btn" id="shuffle" aria-label="Enable shuffle" title="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2c6 0 8-12 14-12h4"/><path d="M2 6h2c2.5 0 4.2 2 5.6 4.4M14.4 13.6C15.8 16 17.5 18 20 18h2"/></svg></button>
        <button type="button" class="icon-btn seek-btn" id="back" aria-label="Back 5 seconds" title="Back 5 seconds" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8a9 9 0 1 1-1 5"/></svg><span>5</span></button>
        <button type="button" class="play-main" id="play" aria-label="Play" title="Play" disabled><svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5a1 1 0 0 1 1.5-.86l10 6.5a1 1 0 0 1 0 1.72l-10 6.5A1 1 0 0 1 8 18.5z"/></svg></button>
        <button type="button" class="icon-btn seek-btn" id="forward" aria-label="Forward 5 seconds" title="Forward 5 seconds" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m17 4 4 4-4 4"/><path d="M21 8a9 9 0 1 0 1 5"/></svg><span>5</span></button>
        <button type="button" class="icon-btn mode-btn" id="repeat" aria-label="Disable repeat Surah" title="Repeat current Surah" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <p class="mode-label" id="mode-label">Repeat on · Current Surah loops</p>
    </section>

    <section class="library" aria-label="Surah library">
      <div class="section-header"><div><h2>Surah Library</h2><p id="library-count">Loading recordings…</p></div></div>
      <div class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><label class="sr-only" for="search">Search by Surah number or name</label><input id="search" type="search" placeholder="Search by name or number, e.g. 114" autocomplete="off" spellcheck="false" disabled><button type="button" id="clear-search" class="clear-search" aria-label="Clear search" title="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="list" id="surah-list" aria-live="off"><p class="empty">Loading your audio library…</p></div>
    </section>
    <p class="notice" id="status" role="status" aria-live="polite"></p>
    <footer>Audio plays from the recordings you provide.</footer>
    <div id="search-scroll-spacer" aria-hidden="true"></div>
  </main>
  <audio id="audio" preload="metadata" playsinline></audio>
</body>
</html>
